<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Verification - Jimini AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; padding: 20px; }
        .container { max-width: 450px; margin: 40px auto; background: #111827; border: 1px solid #1f2937; padding: 25px; border-radius: 12px; text-align: center; }
        h2 { color: #38bdf8; font-size: 22px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; font-size: 15px; text-align: center; }
        input:focus { border-color: #38bdf8; outline: none; }
        .btn { width: 100%; padding: 12px; background: #10b981; color: #fff; border: none; font-weight: bold; border-radius: 6px; font-size: 15px; cursor: pointer; }
        .btn:hover { background: #059669; }
        .back { display: inline-block; margin-top: 15px; color: #64748b; text-decoration: none; font-size: 13px; }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VIP Key Verification</h2>
        <p>Enter your Master Key or Trader ID to unlock bot signals.</p>
        <input type="text" id="vipKey" placeholder="Enter Key or Trader ID">
        <button class="btn" onclick="verifyKey()">Verify & Launch Bot</button>
        <a href="index.html" class="back">← Back to Tasks</a>
    </div>

    <script>
        function verifyKey() {
            var key = document.getElementById('vipKey').value.trim();
            
            // Aapke ghar ke mobiles ke liye Secret Master Key (Aap isko apni marzi se change bhi kar sakte hain)
            var masterKey = "JIMINI-MASTER-999"; 

            if(key === '') {
                alert('Please enter a valid key or Trader ID!');
                return;
            }

            // Agar master key match ho jaye (Aapke mobiles ke liye)
            if(key === masterKey) {
                alert('Admin Access Granted! Welcome to Jimini AI.');
                window.location.href = 'bot.html';
            } 
            // Aam users ke liye Trader ID check
            else if(key.length >= 5) {
                alert('Account Verified Successfully! Access Granted to Jimini AI Bot.');
                window.location.href = 'bot.html';
            } else {
                alert('Invalid Trader ID or Passkey! Please complete tasks or use correct key.');
            }
        }
    </script>
</body>
</html>
