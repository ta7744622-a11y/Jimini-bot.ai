<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimini AI VIP Bot - Live Market Analysis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #07090e; color: #fff; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; }
        .header { background: #111827; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1f2937; margin-bottom: 15px; }
        .logo { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .status { font-size: 12px; background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        
        .market-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { flex: 1; padding: 10px; background: #1f2937; border: none; color: #9ca3af; font-weight: bold; border-radius: 8px; cursor: pointer; text-align: center; transition: 0.3s; }
        .tab.active { background: #38bdf8; color: #000; }

        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 15px; text-align: center; }
        .signal-box { font-size: 28px; font-weight: bold; margin: 15px 0; padding: 15px; border-radius: 8px; }
        .call { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid #22c55e; }
        .put { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; }
        
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; font-size: 14px; color: #94a3b8; }
        .info-item { background: #1f2937; padding: 10px; border-radius: 6px; }
        .info-value { color: #fff; font-weight: bold; margin-top: 4px; }

        .btn { width: 100%; padding: 14px; background: #38bdf8; color: #000; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        .btn:hover { background: #0ea5e9; color: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="logo">🤖 Jimini AI Pro</div>
            <div class="status">● VIP LIVE</div>
        </div>

        <div class="market-tabs">
            <button class="tab active" id="qxTab" onclick="switchMarket('quotex')">Quotex 1M Market</button>
            <button class="tab" id="twTab" onclick="switchMarket('tradewox')">TradeWox 1M Market</button>
        </div>

        <div class="card">
            <h3 id="marketTitle" style="color: #facc15;">Analyzing Quotex OTC Market...</h3>
            <div id="signalBox" class="signal-box call">SCANNING...</div>
            <p id="pairName" style="color: #94a3b8; font-size: 15px;">Asset: EUR/USD (OTC)</p>
            
            <div class="info-grid">
                <div class="info-item">Timeframe<div class="info-value">1 Minute</div></div>
                <div class="info-item">Accuracy<div class="info-value" id="accVal">96.0%</div></div>
                <div class="info-item">Signal Time<div class="info-value" id="sigTime">--:--</div></div>
                <div class="info-item">Expiry<div class="info-value">1 Minute</div></div>
            </div>

            <button class="btn" onclick="generateSignal()">Generate Next Signal</button>
        </div>
    </div>

    <script>
        let currentMarket = 'quotex';

        const qxPairs = ["EUR/USD (OTC)", "GBP/USD (OTC)", "AUD/CAD (OTC)", "EUR/JPY (OTC)", "USD/INR (OTC)"];
        const twPairs = ["BTC/USD (Crypto)", "ETH/USD (Crypto)", "GOLD (Commodity)", "EUR/USD (Forex)", "GBP/JPY (Forex)"];

        function switchMarket(market) {
            currentMarket = market;
            document.getElementById('qxTab').classList.toggle('active', market === 'quotex');
            document.getElementById('twTab').classList.toggle('active', market === 'tradewox');
            
            if(market === 'quotex') {
                document.getElementById('marketTitle').innerText = "Quotex Live 1M AI Analyzer";
            } else {
                document.getElementById('marketTitle').innerText = "TradeWox Live 1M AI Analyzer";
            }
            generateSignal();
        }

        function generateSignal() {
            let pairs = currentMarket === 'quotex' ? qxPairs : twPairs;
            let randomPair = pairs[Math.floor(Math.random() * pairs.length)];
            let types = ['CALL (UP)', 'PUT (DOWN)'];
            let randomType = types[Math.floor(Math.random() * types.length)];
            
            let box = document.getElementById('signalBox');
            box.innerText = "ANALYZING...";
            box.className = "signal-box";

            setTimeout(() => {
                box.innerText = randomType;
                box.className = "signal-box " + (randomType.includes('CALL') ? 'call' : 'put');
                document.getElementById('pairName').innerText = "Asset: " + randomPair;
                
                let now = new Date();
                now.setMinutes(now.getMinutes() + 1);
                document.getElementById('sigTime').innerText = now.toTimeString().substring(0, 5);
                document.getElementById('accVal').innerText = (94 + Math.random() * 3).toFixed(1) + "%";
            }, 600);
        }

        generateSignal();
    </script>
</body>
</html>
