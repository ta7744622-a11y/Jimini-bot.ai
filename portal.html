<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Portal - Jimini AI Bot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b0f19; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 450px; margin: 40px auto; background: #161e2e; padding: 30px; border-radius: 16px; border: 1px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h2 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #334155; background: #0f172a; color: #fff; border-radius: 8px; font-size: 15px; outline: none; text-align: center; }
        input:focus { border-color: #38bdf8; }
        .btn { width: 100%; padding: 12px; background: #22c55e; color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn:hover { background: #16a34a; }
        .back { display: inline-block; margin-top: 20px; color: #94a3b8; text-decoration: none; font-size: 14px; }
        .back:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VIP Key Verification</h2>
        <p>Enter your Trader ID or Account Number to unlock bot signals.</p>
        <input type="text" id="vipKey" placeholder="Enter Trader ID...">
        <button class="btn" onclick="verifyKey()">Verify & Launch Bot</button>
        <a href="index.html" class="back">← Back to Steps</a>
    </div>
    <script>
        function verifyKey() {
            var key = document.getElementById('vipKey').value;
            if(key.trim() !== "") {
                alert("Account Verified Successfully! Access Granted to Jimini AI Bot.");
            } else {
                alert("Please enter a valid Trader ID.");
            }
        }
    </script>
</body>
</html>
